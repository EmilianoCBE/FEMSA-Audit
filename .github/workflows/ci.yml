name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  # En PRs se cancela la corrida anterior; en develop/main nunca se corta un despliegue a medias.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_CLI: vercel@64.3.1
  # Alias fijo para staging (develop). Producción usa el dominio de producción del proyecto.
  STAGING_ALIAS: femsa-audit-staging.vercel.app
  # El front reenvía /api a la API (vercel.json). Producción → API de producción; staging y previews → API de staging.
  API_PROD: https://femsa-audit-api.vercel.app
  API_STAGING: https://femsa-audit-api-staging.vercel.app

jobs:
  calidad:
    name: Lint, tipos y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Lint y formato (Biome)
        run: npm run check
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Pruebas unitarias (Vitest)
        run: npm test

  e2e:
    name: Build y pruebas E2E (Cypress)
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build, servidor y Cypress
        uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm run preview
          wait-on: http://127.0.0.1:4173
      - name: Capturas de pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  deploy:
    name: Deploy a ${{ github.ref_name == 'main' && 'producción' || 'staging' }} (Vercel)
    runs-on: ubuntu-latest
    needs: [calidad, e2e]
    # Solo despliega lo que ya entró a develop o main; los PRs únicamente se validan.
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.publicar.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: 1
      PROD: ${{ github.ref_name == 'main' }}
    outputs:
      url: ${{ steps.publicar.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar Vercel CLI
        run: npm install --global "$VERCEL_CLI"
      - name: Descargar configuración del proyecto
        run: vercel pull --yes --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Apuntar /api a la API de staging
        if: github.ref_name != 'main'
        run: sed -i "s#$API_PROD#$API_STAGING#g" vercel.json && grep -q "$API_STAGING" vercel.json
      - name: Build
        run: vercel build ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Publicar
        id: publicar
        run: |
          if [ "$PROD" = "true" ]; then
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
            # `vercel alias set` necesita leer el usuario del token y falla con tokens de equipo ("User not found"),
            # así que el alias de staging se asigna con la API REST de Vercel.
            api="https://api.vercel.com"
            auth="Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}"
            id=$(curl --fail-with-body -sS -H "$auth" "$api/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
            curl --fail-with-body -sS -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"alias\":\"$STAGING_ALIAS\"}" "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"
            url="https://$STAGING_ALIAS"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Desplegado en $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Prueba de humo (responde y sirve la app)
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ steps.publicar.outputs.url }}" | grep -q '<div id="root">'
          curl --fail --silent --show-error -o /dev/null "${{ steps.publicar.outputs.url }}/login"

  preview:
    name: Preview del PR (Vercel)
    runs-on: ubuntu-latest
    needs: [calidad, e2e]
    # Solo PRs de ramas del mismo repo (los forks no tienen acceso a los secrets).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.publicar.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: 1
    outputs:
      url: ${{ steps.publicar.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar Vercel CLI
        run: npm install --global "$VERCEL_CLI"
      - name: Descargar configuración del proyecto
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Apuntar /api a la API de staging
        run: sed -i "s#$API_PROD#$API_STAGING#g" vercel.json && grep -q "$API_STAGING" vercel.json
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Publicar preview
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview del PR: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comentar la URL en el PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publicar.outputs.url }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n🔎 **Preview de este PR:** ${process.env.PREVIEW_URL}\n\nCommit \`${context.sha.slice(0, 7)}\` · lint, tipos, pruebas unitarias y Cypress en verde. Cypress se vuelve a correr contra esta URL.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previo = comments.find((c) => c.body?.includes(marker));
            if (previo) await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  verificar:
    name: Pruebas E2E sobre el sitio desplegado
    runs-on: ubuntu-latest
    needs: [deploy, preview]
    # Corre después del deploy (develop/main) o del preview (PR), el que se haya ejecutado.
    if: always() && (needs.deploy.result == 'success' || needs.preview.result == 'success')
    env:
      URL_PUBLICADA: ${{ needs.deploy.outputs.url || needs.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cypress contra el sitio publicado
        uses: cypress-io/github-action@v7
        with:
          config: baseUrl=${{ env.URL_PUBLICADA }}
      - name: Capturas de pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-desplegado
          path: cypress/screenshots
          if-no-files-found: ignore
